name: Cloud Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Flutter APK build mode"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Restore Flutter generated Android files
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.build_mode || 'release' }}"
          flutter build apk --"$MODE" 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path("build.log")
          if not log.exists():
              print("::error::build.log was not created")
              raise SystemExit(0)
          lines = log.read_text(errors="replace").splitlines()
          needles = (" e: ", "error:", "Unresolved reference", "Type mismatch", "Cannot infer", "Smart cast", "Compilation error")
          matches = [line.strip() for line in lines if any(needle in f" {line}" for needle in needles)]
          if not matches:
              matches = lines[-80:]
          for line in matches[-80:]:
              line = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{line}")
          PY

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gg-ai-modifier-apk-${{ github.event.inputs.build_mode || 'release' }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
